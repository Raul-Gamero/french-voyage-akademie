# Profil de production (VPS OVHcloud).
spring:
  jpa:
    show-sql: false

server:
  # Nginx est le proxy inverse : sans cela les URL générées et les adresses
  # IP journalisées seraient celles du conteneur, pas celles du client.
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 50
    accesslog:
      enabled: false

logging:
  level:
    root: WARN
    com.frenchvoyage.akademie: INFO
  file:
    name: /var/log/fva/backend.log
