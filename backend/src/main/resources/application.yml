spring:
  application:
    name: french-voyage-akademie
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fva}
    username: ${POSTGRES_USER:fva}
    password: ${POSTGRES_PASSWORD:fva}
    hikari:
      # Le VPS est modeste : un pool étroit vaut mieux qu'un pool qui sature la base.
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      # Le schéma appartient à Flyway. Hibernate ne fait que le vérifier.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          time_zone: UTC
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
  web:
    locale: en
    locale-resolver: accept-header

server:
  port: ${BACKEND_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

fva:
  jwt-secret: ${FVA_JWT_SECRET}
  jwt-expiration-minutes: ${FVA_JWT_EXPIRATION_MINUTES:120}
  cors-allowed-origins: ${FVA_CORS_ALLOWED_ORIGINS:http://localhost:8100,http://localhost:4200}
  privacy-policy-version: "2026-09-01"
  admin:
    email: ${FVA_ADMIN_EMAIL:}
    password: ${FVA_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.frenchvoyage.akademie: INFO
