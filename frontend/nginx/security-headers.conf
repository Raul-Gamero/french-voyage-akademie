# En-têtes de sécurité communs.
# Nginx n'hérite pas des add_header d'un bloc parent dès qu'un bloc enfant en
# déclare un : ce fichier est donc inclus explicitement partout où c'est utile.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# 'unsafe-inline' pour les styles uniquement : Ionic injecte des styles dynamiques.
# Les liens vers les vidéos YouTube s'ouvrent dans un nouvel onglet, aucun iframe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
