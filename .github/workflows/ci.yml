# =====================================================================
# Intégration et déploiement continus — French Voyage Akademie
#
# Chaque push et chaque pull request : tests backend avec seuil de
# couverture, tests et build du frontend, cohérence du contenu.
# Chaque push sur main, une fois tout vert : déploiement sur le VPS.
# =====================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests et couverture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # « verify » exécute les tests puis le contrôle JaCoCo : le build échoue
      # si la couverture de lignes descend sous 40 %.
      - name: Tests et contrôle de couverture
        run: mvn -B verify

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  content:
    name: Contenu — cohérence JSON ⇄ migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Échoue si un exercice n'a pas exactement une bonne réponse, si une
      # traduction manque, ou si le SQL commité ne correspond plus au JSON.
      - name: Validation et fraîcheur des migrations de contenu
        run: python tools/generate_seed.py --check

  migrations:
    name: Migrations — application sur PostgreSQL réel
    runs-on: ubuntu-latest
    needs: content
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fva
          POSTGRES_USER: fva
          POSTGRES_PASSWORD: fva
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fva" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer les migrations dans l'ordre
        env:
          PGPASSWORD: fva
        run: |
          for file in $(ls backend/src/main/resources/db/migration/V*__*.sql | sort -V); do
            echo "→ $file"
            psql -v ON_ERROR_STOP=1 -q -h localhost -U fva -d fva -f "$file"
          done
          psql -h localhost -U fva -d fva -c "SELECT COUNT(*) AS lecons_publiees FROM lessons WHERE published;"

  frontend:
    name: Frontend — tests et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Tests unitaires
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build de production
        run: npx ng build --configuration production

  deploy:
    name: Déploiement — VPS OVHcloud
    runs-on: ubuntu-latest
    needs: [backend, content, migrations, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      # Secrets à définir dans Settings → Environments → production :
      #   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_SSH_KNOWN_HOSTS
      - name: Déployer par SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" '/opt/fva/infra/scripts/deploy.sh'
